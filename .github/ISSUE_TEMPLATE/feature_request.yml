name: Feature request
description: Suggest a new marker, panel, or feature
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or gap?
      description: What can't you currently do, or what's missing?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Reference source (for new markers/ranges)
      description: If requesting a new marker or reference range, link the clinical source (e.g. MedlinePlus, a professional guideline) if you have one.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
