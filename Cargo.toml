[package]
name = "blood_analyzer"
version = "0.3.0"
edition = "2024"
build = "build.rs"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = { version = "0.35.0", default-features = false, features = ["image"] }
genpdf = "0.2.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
winresource = "0.1.31"
